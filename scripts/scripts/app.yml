name: insurance-app
networks:
  default:
    external: true
    name: insurance-network
services:
  product:
    build:
      context: ../..
      dockerfile: src/ProductService/ProductService/Dockerfile
    ports: ["5030:8080"]
  pricing:
    build:
      context: ../..
      dockerfile: src/PricingService/PricingService/Dockerfile
    ports: ["5040:8080"]
  policy:
    build:
      context: ../..
      dockerfile: src/PolicyService/PolicyService/Dockerfile
    ports: ["5050:8080"]
  policysearch:
    build:
      context: ../..
      dockerfile: src/PolicySearchService/PolicySearchService/Dockerfile
    ports: ["5065:8080"]
  payment:
    build:
      context: ../..
      dockerfile: src/PaymentService/PaymentService/Dockerfile
    ports: ["5070:8080"]
  document:
    build:
      context: ../..
      dockerfile: src/DocumentService/DocumentService/Dockerfile
    ports: ["5080:8080"]
  auth:
    build:
      context: ../..
      dockerfile: src/AuthService/AuthService/Dockerfile
    ports: ["6060:8080"]
  chat:
    build:
      context: ../..
      dockerfile: src/ChatService/ChatService/Dockerfile
    ports: ["4099:8080"]
  dashboard:
    build:
      context: ../..
      dockerfile: src/DashboardService/DashboardService/Dockerfile
    ports: ["5035:8080"]
  gateway:
    build:
      context: ../..
      dockerfile: AgentPortalApiGateway/AgentPortalApiGateway/Dockerfile
    ports: ["8099:8099"]
  web:
    build: ../../Web/Web
    ports: ["8080:80"]
