name: insurance-infra
networks:
  default:
    name: insurance-network
services:
  eureka:
    build: ../../eureka-server/eureka-server
    ports: ["8761:8761"]
  postgres:
    build: ../../postgres/postgres
    ports: ["5433:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["15672:15672", "5672:5672"]
    environment:
      RABBITMQ_DEFAULT_USER: lab_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lab_pass}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
volumes:
  postgres-data:
  elasticsearch-data:
  rabbitmq-data:
